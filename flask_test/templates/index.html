<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OCEAN Personality Predictor — ArcFace</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f1117;
      --surface:  #1a1d2e;
      --card:     #22263a;
      --border:   #2e3347;
      --accent:   #6c63ff;
      --accent2:  #a78bfa;
      --green:    #34d399;
      --yellow:   #fbbf24;
      --red:      #f87171;
      --text:     #e2e8f0;
      --muted:    #94a3b8;
      --radius:   14px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 40px;
    }
    header h1 {
      font-size: 2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    header p {
      color: var(--muted);
      margin-top: 8px;
      font-size: 0.9rem;
    }

    /* Upload card */
    .upload-card {
      max-width: 560px;
      margin: 0 auto 36px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
    }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: 10px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color .3s, background .3s;
      position: relative;
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(108,99,255,.05);
    }
    .drop-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .drop-zone .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .drop-zone p   { color: var(--muted); font-size: .9rem; }
    .drop-zone .file-name {
      margin-top: 10px;
      font-weight: 600;
      color: var(--accent2);
      font-size: .9rem;
    }

    .btn-predict {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s, transform .15s;
    }
    .btn-predict:hover  { opacity: .9; transform: translateY(-1px); }
    .btn-predict:active { transform: translateY(0); }
    .btn-predict:disabled { opacity: .5; cursor: not-allowed; }

    /* Progress */
    .progress-wrap { display: none; margin-top: 18px; }
    .progress-bar {
      height: 6px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: 99px;
      transition: width .4s ease;
      animation: shimmer 1.5s infinite linear;
    }
    @keyframes shimmer {
      0%   { filter: brightness(1); }
      50%  { filter: brightness(1.3); }
      100% { filter: brightness(1); }
    }
    .progress-text {
      text-align: center;
      margin-top: 8px;
      font-size: .82rem;
      color: var(--muted);
    }

    /* Results */
    #results-section { display: none; max-width: 760px; margin: 0 auto; }

    .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 99px;
      font-size: .8rem;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .status-ok   { background: rgba(52,211,153,.15); color: var(--green); border: 1px solid rgba(52,211,153,.3); }
    .status-warn { background: rgba(248,113,113,.15); color: var(--red);   border: 1px solid rgba(248,113,113,.3); }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .trait-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      transition: transform .2s, border-color .2s;
    }
    .trait-card:hover { transform: translateY(-3px); border-color: var(--accent); }

    .trait-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .trait-name { font-weight: 600; font-size: .95rem; }
    .trait-badge {
      font-size: .7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 99px;
    }
    .badge-high   { background: rgba(52,211,153,.15); color: var(--green); }
    .badge-medium { background: rgba(251,191,36,.15);  color: var(--yellow); }
    .badge-low    { background: rgba(248,113,113,.15); color: var(--red); }

    .trait-bar-bg {
      height: 8px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .trait-bar-fill {
      height: 100%;
      border-radius: 99px;
      width: 0%;
      transition: width 1s cubic-bezier(.25,.8,.25,1);
    }

    .trait-score {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--accent2);
    }
    .trait-score span { font-size: .85rem; color: var(--muted); font-weight: 400; }
    .trait-desc {
      margin-top: 8px;
      font-size: .78rem;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Error */
    .error-card {
      background: rgba(248,113,113,.08);
      border: 1px solid rgba(248,113,113,.3);
      border-radius: var(--radius);
      padding: 20px;
      color: var(--red);
      text-align: center;
      max-width: 560px;
      margin: 0 auto;
      display: none;
    }

    /* Model info */
    .model-info {
      text-align: center;
      margin-top: 24px;
      font-size: .75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

<header>
  <h1>🧠 OCEAN Personality Predictor</h1>
  <p>Upload video wajah untuk memprediksi kepribadian Big Five menggunakan ArcFace + LSTM</p>
</header>

<!-- Upload -->
<div class="upload-card">
  <div class="drop-zone" id="dropZone">
    <input type="file" id="videoInput" accept=".mp4,.avi,.mov,.mkv">
    <div class="icon">🎬</div>
    <p>Klik atau seret video ke sini</p>
    <p style="font-size:.8rem;margin-top:4px;">Format: MP4, AVI, MOV, MKV · Maks 200MB</p>
    <div class="file-name" id="fileName"></div>
  </div>
  <button class="btn-predict" id="btnPredict" onclick="predict()" disabled>
    Prediksi Kepribadian
  </button>

  <!-- Progress -->
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-text" id="progressText">Memproses video...</div>
  </div>
</div>

<!-- Error -->
<div class="error-card" id="errorCard">
  <strong>⚠️ Error</strong><br>
  <span id="errorMsg"></span>
</div>

<!-- Results -->
<div id="results-section">
  <div style="text-align:center; margin-bottom:16px;">
    <span class="status-badge" id="statusBadge"></span>
  </div>
  <div class="results-grid" id="resultsGrid"></div>
  <div class="model-info" id="modelInfo"></div>
</div>

<script>
const input    = document.getElementById('videoInput');
const btnPredict = document.getElementById('btnPredict');
const fileName = document.getElementById('fileName');
const progressWrap = document.getElementById('progressWrap');
const progressFill = document.getElementById('progressFill');
const progressText = document.getElementById('progressText');
const errorCard    = document.getElementById('errorCard');
const errorMsg     = document.getElementById('errorMsg');
const resultsSection = document.getElementById('results-section');
const statusBadge  = document.getElementById('statusBadge');
const resultsGrid  = document.getElementById('resultsGrid');
const modelInfo    = document.getElementById('modelInfo');

// Drag & drop
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files[0]) {
    input.files = e.dataTransfer.files;
    onFileChange();
  }
});

input.addEventListener('change', onFileChange);

function onFileChange() {
  const f = input.files[0];
  if (f) {
    fileName.textContent = `📄 ${f.name} (${(f.size/1024/1024).toFixed(1)} MB)`;
    btnPredict.disabled = false;
  }
}

// Progress animation
let progressInterval;
function startProgress() {
  progressWrap.style.display = 'block';
  resultsSection.style.display = 'none';
  errorCard.style.display = 'none';
  btnPredict.disabled = true;
  let pct = 0;
  progressInterval = setInterval(() => {
    if (pct < 85) { pct += Math.random() * 4; }
    progressFill.style.width = pct + '%';
    const msgs = ['Memuat video...','Mendeteksi wajah dengan MTCNN...','Mengekstrak embedding ArcFace...','Memproses LSTM...','Menghitung skor OCEAN...'];
    progressText.textContent = msgs[Math.min(Math.floor(pct/20), msgs.length-1)];
  }, 300);
}

function stopProgress() {
  clearInterval(progressInterval);
  progressFill.style.width = '100%';
  setTimeout(() => { progressWrap.style.display = 'none'; progressFill.style.width = '0%'; }, 600);
}

// Predict
async function predict() {
  const file = input.files[0];
  if (!file) return;

  startProgress();

  const formData = new FormData();
  formData.append('video', file);

  try {
    const resp = await fetch('/predict', { method: 'POST', body: formData });
    const data = await resp.json();
    stopProgress();

    if (!resp.ok || data.error) {
      errorMsg.textContent = data.error || 'Terjadi kesalahan tidak diketahui.';
      errorCard.style.display = 'block';
      btnPredict.disabled = false;
      return;
    }

    renderResults(data);
    btnPredict.disabled = false;

  } catch (err) {
    stopProgress();
    errorMsg.textContent = 'Koneksi ke server gagal: ' + err.message;
    errorCard.style.display = 'block';
    btnPredict.disabled = false;
  }
}

function renderResults(data) {
  // Status
  if (data.is_stuck) {
    statusBadge.className = 'status-badge status-warn';
    statusBadge.textContent = '⚠️ Model kemungkinan STUCK — semua nilai terlalu mirip!';
  } else {
    statusBadge.className = 'status-badge status-ok';
    statusBadge.textContent = '✅ Model bekerja normal — prediksi bervariasi';
  }

  // Trait cards
  resultsGrid.innerHTML = '';
  const colors = ['#6c63ff','#a78bfa','#34d399','#fbbf24','#f87171'];

  data.results.forEach((r, i) => {
    const badgeClass = r.level === 'Tinggi' ? 'badge-high' : r.level === 'Sedang' ? 'badge-medium' : 'badge-low';
    const div = document.createElement('div');
    div.className = 'trait-card';
    div.style.borderTop = `3px solid ${colors[i]}`;
    div.innerHTML = `
      <div class="trait-header">
        <span class="trait-name">${r.trait}</span>
        <span class="trait-badge ${badgeClass}">${r.level}</span>
      </div>
      <div class="trait-bar-bg">
        <div class="trait-bar-fill" id="bar_${i}" style="background:${colors[i]}"></div>
      </div>
      <div class="trait-score">${r.percent.toFixed(1)}<span>%</span></div>
      <p class="trait-desc">${r.description}</p>
    `;
    resultsGrid.appendChild(div);

    // Animate bar
    setTimeout(() => {
      document.getElementById(`bar_${i}`).style.width = r.percent + '%';
    }, 100 + i * 80);
  });

  modelInfo.textContent = `Model: ${data.model_path}`;
  resultsSection.style.display = 'block';
  resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>
</body>
</html>
